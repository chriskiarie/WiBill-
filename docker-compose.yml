version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: honestbill_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: honestbill
      POSTGRES_PASSWORD: honestbill_dev_secret
      POSTGRES_DB: honestbill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: honestbill_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: